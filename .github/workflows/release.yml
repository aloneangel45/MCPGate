name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Pre-Release Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify install.sh uses strict LF line endings
        shell: bash
        run: |
          if grep -q $'\r' install.sh; then
            echo "ERROR: install.sh contains CR (\\r) bytes; must be pure LF!" >&2
            exit 1
          fi

      - name: Run go vet and race-enabled test suite
        run: |
          go vet ./...
          go test -v -race -count=1 ./...

  release:
    name: Build & Publish Multi-Arch Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Cross-compile release archives & SHA-256 checksums
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build_unix() {
            local goos="$1"
            local goarch="$2"
            local stage="dist/stage-${goos}-${goarch}"
            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "${stage}/mcpgate" ./cmd/mcpgate
            cp LICENSE README.md CHANGELOG.md "$stage/"
            tar -C "$stage" -czf "dist/mcpgate-${goos}-${goarch}.tar.gz" mcpgate LICENSE README.md CHANGELOG.md
            rm -rf "$stage"
          }

          build_windows() {
            local goarch="$1"
            local stage="dist/stage-windows-${goarch}"
            mkdir -p "$stage"
            GOOS="windows" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "${stage}/mcpgate.exe" ./cmd/mcpgate
            cp LICENSE README.md CHANGELOG.md "$stage/"
            (cd "$stage" && zip -q "../mcpgate-windows-${goarch}.zip" mcpgate.exe LICENSE README.md CHANGELOG.md)
            rm -rf "$stage"
          }

          build_unix linux amd64
          build_unix linux arm64
          build_unix darwin amd64
          build_unix darwin arm64
          build_windows amd64
          build_windows arm64

          (
            cd dist
            sha256sum mcpgate-*.tar.gz mcpgate-*.zip > checksums.txt
            cat checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/mcpgate-linux-amd64.tar.gz
            dist/mcpgate-linux-arm64.tar.gz
            dist/mcpgate-darwin-amd64.tar.gz
            dist/mcpgate-darwin-arm64.tar.gz
            dist/mcpgate-windows-amd64.zip
            dist/mcpgate-windows-arm64.zip
            dist/checksums.txt
