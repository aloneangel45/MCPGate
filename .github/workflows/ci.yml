name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify install.sh uses strict LF line endings
        shell: bash
        run: |
          if grep -q $'\r' install.sh; then
            echo "ERROR: install.sh contains CR (\\r) bytes; must be pure LF!" >&2
            exit 1
          fi

      - name: Run static analysis (go vet)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Run full test suite with race detector
        run: go test -v -race -count=1 ./...

      - name: Build CLI binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.Version=ci" ./cmd/mcpgate

      - name: Verify multi-arch pure-Go cross-compilation
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            echo "Cross-compiling ${goos}/${goarch}..."
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.Version=ci" \
              -o "/tmp/mcpgate-${goos}-${goarch}${ext}" ./cmd/mcpgate
            rm -f "/tmp/mcpgate-${goos}-${goarch}${ext}"
          done
